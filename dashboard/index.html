<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10151c">
  <title>Maria — Testing command center</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><div class="brand-icon">M<span>✳</span></div><div><strong>maria</strong><small>TESTING COMMAND CENTER</small></div></div>
      <div class="side-label">WORKSPACE</div>
      <nav id="nav">
        <button class="nav-item active" data-view="overview"><span>◫</span> Overview</button>
        <button class="nav-item" data-view="product"><span>◇</span> Product context</button>
        <button class="nav-item" data-view="cases"><span>☷</span> Test cases</button>
        <button class="nav-item" data-view="runs"><span>◷</span> Test runs</button>
        <button class="nav-item" data-view="files"><span>▤</span> Project files</button>
      </nav>
      <div class="side-label project-label">PROJECTS</div>
      <div id="project-list" class="project-list"></div>
      <button class="add-project" id="browse-button"><span>＋</span> Add a project</button>
      <div class="sidebar-bottom"><span class="status-dot"></span> Local command center <small id="version"></small></div>
    </aside>
    <div class="main-wrap">
      <header class="topbar">
        <div class="breadcrumb">Workspace <span>/</span> <strong id="crumb-project">No project selected</strong></div>
        <div class="top-actions"><span class="agent-badge" id="agent-status">Checking agents…</span><button class="icon-button" id="refresh-button" title="Refresh">↻</button></div>
      </header>
      <main id="main" class="content"></main>
    </div>
  </div>
  <div id="picker" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-label="Select project folder">
    <div class="picker-card">
      <div class="picker-heading"><div><small>LOCAL FILESYSTEM</small><h2>Select a project folder</h2></div><button id="close-picker" class="icon-button" aria-label="Close">✕</button></div>
      <div class="path-row"><button id="folder-up" class="icon-button" title="Parent folder">↑</button><input id="folder-path" aria-label="Folder path"><button id="folder-go" class="button secondary">Go</button></div>
      <div id="folder-list" class="folder-list"></div>
      <div class="picker-footer"><span id="folder-count"></span><button id="select-folder" class="button primary">Use this folder <span>↗</span></button></div>
    </div>
  </div>
  <div id="toast" class="toast hidden" role="status"></div>
</body>
</html>
